<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun in the Zodiac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --space:#04060d; --panel:#0c1222; --panel2:#131b31; --line:#243152;
  --text:#d9e0ef; --dim:#8c98b5; --gold:#f2c46b; --beam:#ffb54d; --night:#7fb2ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--space);color:var(--text);
  font:15px/1.4 Barlow,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px}
h1{font:22px/1 Marcellus,Georgia,serif;margin:0 18px 2px 0;color:var(--gold);letter-spacing:.02em}
.grp{display:flex;align-items:flex-end;gap:8px}
.grp + .grp{border-left:1px solid var(--line);padding-left:18px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
select,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:4px;padding:4px 6px;font:inherit;font-size:14px}
input[type=number]{width:62px}
input[type=range]{accent-color:var(--gold);width:190px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;
  padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.rec{border-color:#7a2b2b;color:#ffc9c9}
button.rec:hover{border-color:#ff6b6b}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tog{display:flex;flex-wrap:wrap;gap:4px 12px;max-width:430px;font-size:13px}
.tog label{display:flex;align-items:center;gap:5px;cursor:pointer}
.tog input{accent-color:var(--gold)}
#dateOut{font-size:14px;color:var(--text);min-width:52px}
main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 1px var(--line)}
#status{font-size:13px;color:var(--dim);min-width:200px}
#bar{height:4px;width:200px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:4px}
#bar i{display:block;height:100%;width:0;background:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>Sun in the Zodiac</h1>

  <div class="grp">
    <button id="play">Pause</button>
    <button id="today" title="Jump to today's date">Today</button>
    <label class="f">Date <span style="display:flex;gap:8px;align-items:center">
      <input id="day" type="range" min="0" max="365" step="0.25"><span id="dateOut"></span></span></label>
    <label class="f">Speed
      <select id="speed">
        <option value="10">1 year in 10 s</option>
        <option value="20" selected>1 year in 20 s</option>
        <option value="30">1 year in 30 s</option>
        <option value="60">1 year in 60 s</option>
      </select></label>
    <label class="f">View
      <input id="tilt" type="range" min="30" max="90" step="1" value="58"></label>
  </div>

  <div class="grp tog">
    <label><input type="checkbox" id="tBeam" checked> Line of sight</label>
    <label><input type="checkbox" id="tNight"> Midnight sky</label>
    <label><input type="checkbox" id="tBounds" checked> Constellation boundaries</label>
    <label><input type="checkbox" id="tSigns"> Astrological signs</label>
    <label><input type="checkbox" id="tMonths" checked> Months on orbit</label>
    <label><input type="checkbox" id="tCap" checked> Captions</label>
  </div>

  <div class="grp">
    <label class="f">Length (s)<input id="rLen" type="number" min="2" max="300" value="20"></label>
    <label class="f">FPS<select id="rFps"><option>30</option><option>60</option></select></label>
    <label class="f">Format<select id="rFmt"><option value="mp4" selected>MP4 (H.264)</option><option value="webm">WebM (VP9)</option></select></label>
    <label class="f">Hold at end<select id="rHold">
      <option value="0">none</option><option value="1">1 s</option><option value="2" selected>2 s</option>
      <option value="3">3 s</option><option value="5">5 s</option></select></label>
    <label class="f">Span<select id="rSpan">
      <option value="365.2422" selected>1 year</option>
      <option value="182.62">6 months</option>
      <option value="91.31">3 months</option>
      <option value="30.44">1 month</option></select></label>
    <label class="f" title="On: the recording plays at normal speed while it's made. Off: renders as fast as the computer can. The saved file is identical either way.">Pace
      <select id="rPace"><option value="real" selected>Real time</option><option value="fast">As fast as possible</option></select></label>
    <button id="rec" class="rec">● Record</button>
    <div><div id="status">Records 1920×1080 video, starting from the date shown.</div><div id="bar"><i></i></div></div>
  </div>
</header>
<main><canvas id="cv" width="1920" height="1080" aria-label="Earth orbiting the Sun, with the line of sight through the Sun to the zodiac constellations"></canvas></main>

// ---- H.264 packaging that doesn't depend on the browser's decoderConfig ----
// Firefox's encoder can hand back H.264 chunks without meta.decoderConfig, which
// leaves the MP4 with no avcC box (and mp4-muxer throws on it). So the parameter
// sets are read from the stream itself and the avcC box is built here.
const H264 = {
  // Split a chunk into NAL units. Accepts Annex B (start codes) or AVCC (4-byte lengths).
  split(u8) {
    const out = [], n = u8.length;
    const annexB = n > 4 && u8[0] === 0 && u8[1] === 0 && (u8[2] === 1 || (u8[2] === 0 && u8[3] === 1));
    if (!annexB) {
      for (let i = 0; i + 4 <= n;) {
        const len = (u8[i] << 24 | u8[i + 1] << 16 | u8[i + 2] << 8 | u8[i + 3]) >>> 0; i += 4;
        if (len === 0 || i + len > n) break;
        out.push(u8.subarray(i, i + len)); i += len;
      }
      return out;
    }
    let i = 0, start = -1;
    while (i + 2 < n) {
      if (u8[i] === 0 && u8[i + 1] === 0 && u8[i + 2] === 1) {
        if (start >= 0) { let e = i; while (e > start && u8[e - 1] === 0) e--; out.push(u8.subarray(start, e)); }
        i += 3; start = i;
      } else i++;
    }
    if (start >= 0) out.push(u8.subarray(start, n));
    return out.filter(x => x.length);
  },
  type: nal => nal[0] & 31,
  // Length-prefixed sample with SPS/PPS/AUD removed (they live in avcC).
  toSample(nals) {
    const keep = nals.filter(x => { const t = x[0] & 31; return t !== 7 && t !== 8 && t !== 9; });
    const out = new Uint8Array(keep.reduce((a, x) => a + 4 + x.length, 0));

    for (const x of keep) { out[o] = x.length >>> 24; out[o + 1] = x.length >>> 16 & 255; out[o + 2] = x.length >>> 8 & 255; out[o + 3] = x.length & 255; out.set(x, o + 4); o += 4 + x.length; }
    return out;
  },
  avcC(sps, pps) {
    const hi = [100, 110, 122, 144].includes(sps[1]);
    const b = [1, sps[1], sps[2], sps[3], 0xFF, 0xE1, sps.length >> 8, sps.length & 255, ...sps, 1, pps.length >> 8, pps.length & 255, ...pps];

    for (const [, lo] of IAU) {

      ctx.strokeStyle = 'rgba(255,220,150,0.45)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.stroke();
    }
    const [a, b] = iauSpan(sunCon); arc(a, b, RZ, 'rgba(255,196,95,0.9)', 4);
    if (opt.tNight) { const [c, d] = iauSpan(nightCon); arc(c, d, RZ, 'rgba(127,178,255,0.85)', 4); }
  }

  // constellations
  for (const k in CONS) if (k !== sunCon && !(opt.tNight && k === nightCon)) drawConstellation(k, 0);
  if (opt.tNight) drawConstellation(nightCon, 2);
  drawConstellation(sunCon, 1);

  // Earth's orbit and month ticks
  arc(0, 2 * Math.PI - 1e-4, 1, 'rgba(140,175,255,0.45)', 1.6);
  if (opt.tMonths) {
    for (let m = 0; m < 12; m++) {
      const dm = (Date.UTC(YEAR, m, 1) - Y0) / 864e5, le = sunLon(dm) * D2R + Math.PI;
      const q0 = ringPt(le, 0.95), q1 = ringPt(le, 1.05), ql = ringPt(le, 1.17);
      ctx.strokeStyle = 'rgba(160,190,255,0.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.stroke();
      ctx.font = `${Math.round(16 * ql.f)}px Barlow, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(175,198,245,0.8)'; ctx.fillText(MON[m], ql.x, ql.y);
    }
  }

  // sight lines
  const pE = P(ex, ey), pS = P(0, 0);
  const hitSun = ringPt(lamSun, RZ), hitNight = ringPt(lamE, RZ);
  if (opt.tNight) {
    ctx.save(); ctx.setLineDash([10, 9]); glowLine(pE, hitNight, '127,178,255', 2.2, 0.9, 0.75); ctx.restore();
    marker(hitNight, '127,178,255', 9);
  }
  const earthBehind = pE.depth < pS.depth;
  if (earthBehind) drawEarth(ex, ey, day, t);
  if (opt.tBeam) glowLine(pE, pS, '255,190,90', 3, 0.95, 0.9);
  const sun = drawSun(t);
  if (opt.tBeam) {
    const dx = hitSun.x - pS.x, dy = hitSun.y - pS.y, L = Math.hypot(dx, dy) || 1;
    const from = { x: pS.x + dx / L * sun.r * 1.05, y: pS.y + dy / L * sun.r * 1.05 };   // start at the limb, not across the disk
    glowLine(from, hitSun, '255,190,90', 3, 0.9, 0.8);
    marker(hitSun, '255,200,110', 11);
  }
  if (!earthBehind) drawEarth(ex, ey, day, t);

  // body labels
  ctx.font = `${Math.round(20 * pE.f)}px Barlow, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(200,220,255,0.9)'; ctx.fillText('Earth', pE.x, pE.y + EARTH_R * S * pE.f + 10);
  ctx.fillStyle = 'rgba(255,225,170,0.9)'; ctx.fillText('Sun', pS.x, pS.y + sun.r + 12);

  // captions
  if (opt.tCap) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#eef2fb'; ctx.font = '54px Marcellus, Georgia, serif'; ctx.fillText(longDate(day), 64, 108);
    ctx.fillStyle = '#ffd88a'; ctx.font = '34px Marcellus, Georgia, serif';
    ctx.fillText(`The Sun is in ${sunCon}`, 66, 160);
    ctx.fillStyle = 'rgba(215,222,240,0.78)'; ctx.font = '23px Barlow, sans-serif';
    ctx.fillText(`${sunCon}: ${rangeOf(iauAt, day, 'c')}`, 67, 196);
    let y = 240;
    if (opt.tSigns) {
      ctx.fillStyle = '#dcc0ff'; ctx.font = '26px Barlow, sans-serif';
      ctx.fillText(`Astrological sign: ${signAt(sunLon(day))}  (${rangeOf(signAt, day, 's')})`, 67, y); y += 38;
    }
    if (opt.tNight) {
      ctx.fillStyle = '#a9ccff'; ctx.font = '26px Barlow, sans-serif';
      ctx.fillText(`Up all night: ${nightCon}`, 67, y);
    }
  }
}

// ---------------- live loop & controls ----------------
let day = Math.max(0, Math.min(365, todayDay())), playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), clock = 0, recording = false;
function syncUI() { $('day').value = day; $('dateOut').textContent = shortDate(day); $('play').textContent = playing ? 'Pause' : 'Play'; }
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!recording) {
    if (playing) { day = (day + dt * YLEN / +$('speed').value) % YLEN; clock += dt; }
    tilt = +$('tilt').value * D2R; readOpts(); render(day, clock); syncUI();
  }
  requestAnimationFrame(tick);
}
$('play').onclick = () => { playing = !playing; syncUI(); };
$('today').onclick = () => { day = Math.max(0, Math.min(365, todayDay())); syncUI(); };
$('day').oninput = e => { day = +e.target.value; playing = false; syncUI(); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; syncUI(); }
  if (e.code === 'ArrowRight') { day = (day + 1) % YLEN; syncUI(); }
  if (e.code === 'ArrowLeft') { day = (day - 1 + YLEN) % YLEN; syncUI(); }
});

// ---------------- MP4 recorder ----------------
const status = m => $('status').textContent = m, bar = f => $('bar').firstChild.style.width = (f * 100).toFixed(1) + '%';
async function pickCodec(fps, fmt) {
  const list = fmt === 'mp4'
    ? ['avc1.640033', 'avc1.640032', 'avc1.640028', 'avc1.4d0033', 'avc1.4d0028', 'avc1.42e033', 'avc1.42e028']
    : ['vp09.00.41.08', 'vp09.00.40.08', 'vp09.00.31.08'];
  for (const codec of list) for (const avcFormat of (fmt === 'mp4' ? ['annexb', 'avc'] : [null])) {
    const cfg = { codec, width: W, height: H, bitrate: 16e6, framerate: fps };
    if (avcFormat) cfg.avc = { format: avcFormat };   // Annex B keeps SPS/PPS in the stream
    try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) return cfg; } catch (e) {}
  }
  return null;
}
$('rec').onclick = async () => {
  if (recording) return;
  if (!('VideoEncoder' in window)) { status('This browser cannot encode video. Use current Chrome, Edge or Firefox.'); return; }
  const fps = +$('rFps').value, secs = Math.max(2, +$('rLen').value || 20), span = +$('rSpan').value, fmt = $('rFmt').value;
  const cfg = await pickCodec(fps, fmt);
  if (!cfg) {
    status(fmt === 'mp4' ? 'This browser has no H.264 encoder. Use Chrome or Edge, or choose WebM.'
                         : 'This browser has no VP9 encoder. Choose MP4.');
    return;
  }
  recording = true; $('rec').disabled = true; readOpts(); tilt = +$('tilt').value * D2R;
  await document.fonts.ready;
  // Same pattern as the other animations: a short hold on the opening frame, the motion,
  // then a hold on the closing frame so the clip doesn't stop dead. The Sun and Earth keep
  // their gentle motion during the holds, so the held frames aren't a frozen still.
  const hold = +$('rHold').value;
  const NPRE = Math.round(fps * 0.4), NMOVE = Math.max(2, Math.round(fps * secs)), NPOST = Math.round(fps * hold);
  const N = NPRE + NMOVE + NPOST, start = day, t0 = clock;
  const muxer = fmt === 'mp4'
    ? new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory' })
    : new WebMMuxer.Muxer({ target: new WebMMuxer.ArrayBufferTarget(),
        video: { codec: 'V_VP9', width: W, height: H, frameRate: fps }, firstTimestampBehavior: 'offset' });
  let err = null;
  const dur = Math.round(1e6 / fps);
  // MP4: the H.264 chunks are collected, then packaged after the encoder finishes.
  // Firefox's encoder uses B-frames: chunks arrive in decode order with presentation
  // timestamps that jump back (66666 -> 33333), and it may not supply decoderConfig.
  // So the parameter sets are read from the stream (see H264 above) and proper
  // decode/presentation times are worked out here instead of trusting the browser.
  const mp4Chunks = [];
  const onMp4 = (ch, meta) => {
    try {
      const buf = new Uint8Array(ch.byteLength); ch.copyTo(buf);
      mp4Chunks.push({ data: buf, type: ch.type, pts: ch.timestamp, meta });
    } catch (e) { err = e; }
  };
  function packageMp4() {
    let list = mp4Chunks;
    const k0 = list.findIndex(c => c.type === 'key');
    if (k0 < 0) throw new Error('the encoder produced no keyframe. Try WebM.');
    list = list.slice(k0);                                  // the file must open on a keyframe
    const sorted = list.map(c => c.pts).sort((a, b) => a - b);
    let shift = 0;                                          // reordering delay (B-frames)
    list.forEach((c, k) => { shift = Math.max(shift, sorted[k] - c.pts); });
    const base = sorted[0];
    let meta = null;
    {
      const nals = H264.split(list[0].data);
      const sps = nals.find(x => (x[0] & 31) === 7), pps = nals.find(x => (x[0] & 31) === 8);
      let desc = null;
      if (sps && pps) desc = H264.avcC(sps, pps);
      else {
        const m = list[0].meta && list[0].meta.decoderConfig;
        if (m && m.description) {
          const d = m.description;
          desc = ArrayBuffer.isView(d) ? new Uint8Array(d.buffer, d.byteOffset, d.byteLength).slice() : new Uint8Array(d).slice();
        }
      }
      if (!desc) throw new Error('the encoder gave no H.264 parameter sets. Try WebM.');
      meta = { decoderConfig: { codec: sps ? H264.codecString(sps) : cfg.codec, codedWidth: W, codedHeight: H, description: desc } };
    }
    list.forEach((c, k) => {
      const pts = c.pts + shift - base, dts = sorted[k] - base;
      muxer.addVideoChunkRaw(H264.toSample(H264.split(c.data)), c.type, pts, dur, k === 0 ? meta : undefined, pts - dts);
    });
  }
  const onWebm = (ch, meta) => { try { muxer.addVideoChunk(ch, meta); } catch (e) { err = e; } };
  const enc = new VideoEncoder({ output: fmt === 'mp4' ? onMp4 : onWebm, error: e => err = e });
  enc.configure(cfg);
  // Pacing only changes how long the render takes to watch, never the file: every frame
  // carries its own timestamp. In real time the loop waits for each frame's moment;
  // if the computer falls behind it simply doesn't wait, and the file is unaffected.
  const realTime = $('rPace').value === 'real', wall0 = performance.now();
  try {
    for (let i = 0; i < N; i++) {
      if (err) throw err;
      const m = Math.min(Math.max(i - NPRE, 0), NMOVE - 1);     // lands exactly on the end date
      const d = (start + span * m / (NMOVE - 1)) % YLEN;
      render(d, t0 + i / fps);
      const fr = new VideoFrame(cv, { timestamp: i * dur, duration: dur });
      enc.encode(fr, { keyFrame: i % (fps * 2) === 0 }); fr.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (realTime) {
        const wait = wall0 + (i + 1) * 1000 / fps - performance.now();
        if (wait > 1) await new Promise(r => setTimeout(r, wait));
        if (i % 5 === 0) { bar(i / N); status(`Recording ${((i + 1) / fps).toFixed(1)} s of ${(N / fps).toFixed(1)} s…`); }
      } else if (i % 10 === 0) {
        bar(i / N); status(`Rendering frame ${i + 1} of ${N} (faster than real time)…`); await new Promise(r => setTimeout(r, 0));
      }
    }
    await enc.flush(); if (err) throw err;
    if (fmt === 'mp4') { status('Packaging MP4…'); packageMp4(); }
    muxer.finalize(); enc.close();
    const blob = new Blob([muxer.target.buffer], { type: fmt === 'mp4' ? 'video/mp4' : 'video/webm' });
    const name = `Sun_in_the_Zodiac_${secs}s_hold${hold}s_${fps}fps.${fmt}`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    bar(1); status(`Saved ${name} (${(blob.size / 1e6).toFixed(1)} MB, ${(N / fps).toFixed(1)} s: 0.4 s lead-in, ${secs} s motion, ${hold} s hold).`);
  } catch (e) {
    status('Recording stopped: ' + (e.message || e)); try { enc.close(); } catch (_) {}
  }
  recording = false; $('rec').disabled = false;
};

syncUI(); requestAnimationFrame(tick);
</script></body></html>
